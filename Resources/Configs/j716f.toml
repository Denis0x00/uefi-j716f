# Experimental diagnostic placement; hardware verification pending.
[boot_shim]
requires_kernel_header = true
[uefi_fd]
base = 0xce000000
size = 0x700000
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = true
[boot_image]
header_version = 2
base = 0
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
tags_offset = 0x100
dtb_offset = 0x1f00000
pagesize = 4096
