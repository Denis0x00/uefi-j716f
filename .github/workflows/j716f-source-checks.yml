name: J716F UEFI source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check submodule pins and executable file modes
        run: |
          python3 - <<'PY'
          import configparser
          import subprocess
          from pathlib import Path
          index = {}
          for row in subprocess.check_output(['git', 'ls-files', '--stage', '-z']).split(b'\0'):
              if row:
                  meta, name = row.split(b'\t', 1)
                  mode, sha, stage = meta.decode().split()
                  index[name.decode()] = (mode, sha)
          config = configparser.ConfigParser()
          config.read('.gitmodules')
          pins = []
          for section in config.sections():
              path = config[section]['path']
              if path not in index or index[path][0] != '160000':
                  raise SystemExit(f'Missing pinned submodule gitlink: {path}')
              pins.append(f'{path}: {index[path][1]}')
          for path in ('build_uefi.py', 'build_active_devices.sh', 'setup_env.sh'):
              if index[path][0] != '100755':
                  raise SystemExit(f'Executable bit missing: {path}')
              if b'\r\n' in Path(path).read_bytes():
                  raise SystemExit(f'Expected Linux LF endings: {path}')
          if any(p.startswith('Binaries/j716f/') or p.endswith('.fat')
                 for p in index):
              raise SystemExit('Local J716F vendor/generated inputs must stay outside Git')
          print('\n'.join(pins))
          print(f'{len(pins)} gitlinks and 3 executable entry points verified')
          PY

      - name: Check J716F source and configuration syntax
        run: |
          bash -n build_active_devices.sh setup_env.sh
          python3 - <<'PY'
          import ast
          import json
          import tomllib
          from pathlib import Path
          board = Path('Platforms/Lenovo/j716fPkg')
          for path in [Path('build_uefi.py'), *board.rglob('*.py')]:
              ast.parse(path.read_text(), filename=str(path))
          for path in board.rglob('*.json'):
              json.loads(path.read_text())
          config = tomllib.loads(Path('Resources/Configs/j716f.toml').read_text())
          assert config['boot_image']['header_version'] == 2
          dtb = Path('Resources/DTBs/j716f.dtb')
          assert dtb.is_file() and dtb.stat().st_size == 728300 and dtb.read_bytes()[:4] == b'\xd0\x0d\xfe\xed'
          assert (board / 'j716f.dsc').is_file()
          assert (board / 'j716f.fdf').is_file()
          dsc_text = (board / 'j716f.dsc').read_text()
          dxe_text = (board / 'Include/ENTRY_V15_DXE.inc').read_text()
          for required in ('UniXNUDxe.inf', 'UniXNURamDiskDxe.inf', 'DarwinBoot.inf', 'J716fInheritedFbDxe.inf', 'J716fKeysDxe.inf', 'J716fIoConsoleBdsDxe.inf'):
              assert required in dsc_text and required in dxe_text, f'Missing {required} in j716f DSC/DXE'
          print('J716F Python, JSON and boot-image configuration syntax passed')
          PY

      - name: Check J716F SM8250 memory map and descriptor non-overlap policy
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          board = Path('Platforms/Lenovo/j716fPkg')
          mmap = (board / 'Library/MemoryMapLib/MemoryMapLib.c').read_text()
          pattern = re.compile(r'\{\s*"([^"]+)"\s*,\s*(0x[0-9A-Fa-f]+)\s*,\s*(0x[0-9A-Fa-f]+)\s*,')
          regions = [(name, int(base, 16), int(size, 16)) for name, base, size in pattern.findall(mmap)]
          assert len(regions) >= 45, f'Unexpected region count: {len(regions)}'
          by_name = {name: (base, size) for name, base, size in regions}
          assert by_name['USB30_PRIM'] == (0x0A600000, 0x0011B000)
          assert by_name['AOP CMD DB'] == (0x80860000, 0x00020000)
          assert by_name['Display Reserved'] == (0x9C000000, 0x02400000)
          assert by_name['Boot Log'] == (0xB0000000, 0x00080000)
          assert by_name['DXE Heap'] == (0xC0000000, 0x0E000000)
          assert by_name['UEFI FD'] == (0xCE000000, 0x00700000)
          assert by_name['XNU Window'] == (0xD0000000, 0x20000000)
          assert by_name['High RAM'] == (0xFFC20000, 0xF83E0000)
          sorted_dram = sorted([r for r in regions if r[1] >= 0x80000000], key=lambda r: r[1])
          for (n1, b1, s1), (n2, b2, s2) in zip(sorted_dram, sorted_dram[1:]):
              assert b1 + s1 <= b2, f'DRAM overlap between {n1} (0x{b1:x}+0x{s1:x}) and {n2} (0x{b2:x})'
          print(f'Verified {len(regions)} J716F SM8250 memory descriptors ({len(sorted_dram)} non-overlapping DRAM regions)')
          PY

      - name: Verify the Python build entry point can execute on Linux
        run: |
          python3 -m pip install --break-system-packages coloredlogs==15.0.1 || python3 -m pip install coloredlogs==15.0.1
          ./build_uefi.py --help

      - name: Summary
        run: |
          {
            echo '## J716F UEFI source checks'
            echo 'Checked Git metadata, script execution and J716F configuration syntax.'
            echo 'This job does not compile a firmware volume or validate a hardware boot.'
            echo 'The legacy all-active-devices script is retained for source provenance; it is not run by this workflow.'
            echo 'The official firmware path and pinned external dependencies are documented in Building.md.'
          } >> "$GITHUB_STEP_SUMMARY"
