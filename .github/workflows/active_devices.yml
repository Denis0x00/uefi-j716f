name: Build upstream active devices (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI_BUILD: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build UEFI for active devices
        run: bash ./setup_env.sh -p apt && bash ./build_active_devices.sh -r DEBUG

      - name: Upload UEFI images
        uses: actions/upload-artifact@v7
        with:
          name: uefi-images
          path: ./Mu-*
          compression-level: 9
